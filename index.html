<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Offline Player</title>
    <!-- Yeh line manifest file ko connect karti hai -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff0000">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: #212121;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }
        .container {
            padding: 15px;
            text-align: center;
        }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            background: #cc0000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        video {
            width: 100%;
            max-height: 300px;
            background: #000;
            margin-top: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>YouTube Offline Player</header>

    <div class="container">
        <p>Apne phone se offline video select karein:</p>
        <input type="file" id="videoInput" accept="video/*" multiple>
        <br>
        <video id="videoPlayer" controls></video>
    </div>

    <script>
        const videoInput = document.getElementById('videoInput');
        const videoPlayer = document.getElementById('videoPlayer');

        videoInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (files.length > 0) {
                const fileURL = URL.createObjectURL(files[0]);
                videoPlayer.src = fileURL;
                videoPlayer.play();
            }
        });
    </script>

</body>
</html>
