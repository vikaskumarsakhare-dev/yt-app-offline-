<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e18">
<title>V Player</title>
<style>
:root{
  --bg:#0b0e18; --surface:#141a2b; --surface-2:#1d2540; --line:#273049;
  --fg:#eef0f7; --muted:#929ab6; --accent:#ffb52e; --ink:#1a1204; --danger:#ff7a7a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.g{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.brand svg{width:30px;height:30px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--fg);flex:none}
.ib:active{background:var(--surface-2)}
.ib svg{width:24px;height:24px}
.acts{display:flex;gap:2px}
.srch{padding-bottom:8px}
.srch input{width:100%;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 16px;font:inherit}
.srch input::placeholder{color:var(--muted)}

#view{flex:1;min-height:0;position:relative}
.scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-block:6px 20px}
.h{display:flex;align-items:baseline;justify-content:space-between;padding-block:6px 12px}
.h h1{margin:0;font-size:20px;font-weight:800}
.h span{color:var(--muted);font-size:13px}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:24px}
.center .ico{width:72px;height:72px;border-radius:22px;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.center h2{margin:0;font-size:19px}
.center p{margin:0;color:var(--muted);max-width:32ch}
.btn{background:var(--accent);color:var(--ink);font-weight:700;padding:11px 22px;border-radius:999px}
.btn.alt{background:var(--surface-2);color:var(--fg)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px 16px}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.card{min-width:0;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--surface-2),var(--surface))}
.sgrid .thumb{aspect-ratio:9/16;border-radius:10px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.74);padding:1px 7px;border-radius:6px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.ttl{font-weight:700;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding-block:8px;cursor:pointer;min-width:0}
.row .tx{flex:1;min-width:0}
.row .ttl{-webkit-line-clamp:1}
.art{width:52px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center;color:rgba(255,255,255,.92)}
.art svg{width:24px;height:24px}

#mini{background:var(--surface);border-top:1px solid var(--line)}
.mini{display:flex;align-items:center;gap:6px;padding-block:6px}
.mini .tx{flex:1;min-width:0;padding-inline:8px}
.mini .ttl{-webkit-line-clamp:1}

.tabs{background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabin{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{display:grid;place-items:center;height:54px;color:var(--muted)}
.tab svg{width:28px;height:28px}
.tab[aria-selected="true"]{color:var(--accent)}

.panel{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.ph{display:flex;align-items:center;gap:6px;padding-block:8px}
.ph h2{margin:0;font-size:19px}
.pc{flex:1;min-height:0;overflow-y:auto;padding-block:8px 24px}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
.set{display:flex;flex-direction:column;gap:14px;align-items:flex-start}

#player{position:fixed;inset:0;z-index:60;background:#000}
#pv{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#pback{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.5);color:#fff}
#ptitle{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:calc(60px + env(safe-area-inset-left,0px));right:16px;height:42px;display:flex;align-items:center;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.8);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.shelf{grid-column:1/-1;padding-block:4px}
.shh{font-weight:800;font-size:17px;padding-bottom:10px}
.shrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:4px}
.shrow::-webkit-scrollbar{display:none}
.sc{flex:none;width:34vw;max-width:150px;min-width:110px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.sc .thumb{aspect-ratio:9/16;border-radius:12px}
.sc .ttl{font-size:13px;-webkit-line-clamp:2}
#reels{position:fixed;inset:0;z-index:55;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
.rtrack{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
.reel{position:absolute;left:0;width:100%;height:100%;background:#111827;overflow:hidden}
/* A real image layer stays visible underneath the player while a finger is dragging. */
.reel .rposter{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:0;display:block;background:linear-gradient(135deg,#26364b,#101722)}
.reel.tall .rposter{object-fit:cover}
.reel.eng-live .rposter{visibility:hidden}
.reel video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;z-index:1}
.reel.tall video{object-fit:cover}
.rback{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:3;background:rgba(0,0,0,.45);color:#fff}
.rcap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding-top:90px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.rcap .t{font-weight:700;font-size:15px;padding-right:70px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.rcap .s{font-size:12.5px;color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums}
.rside{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;flex-direction:column;align-items:center;gap:14px}
.sb{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff}
.sb svg{width:24px;height:24px}
.sbw{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.sb.liked{color:#ff3b5c}
.sb.liked svg{fill:currentColor}
.sb.arm{width:auto;padding:0 14px;border-radius:999px;background:var(--danger);color:#2a0606;font-weight:700;font-size:13px;white-space:nowrap}
.rprog{position:absolute;left:0;right:0;bottom:0;height:28px;z-index:3;touch-action:none}
.rprog .rbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2)}
.rprog.on .rbar{height:7px}
.rprog i{display:block;height:100%;width:0;background:var(--accent)}
.rcap .s.rtime{pointer-events:auto;color:rgba(255,255,255,.78);padding:4px 0}
#rheart{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:3;color:#ff3b5c}
#rheart svg{width:96px;height:96px;fill:currentColor}
#rheart.go{animation:hrt .7s ease-out}
@keyframes hrt{0%{opacity:1;transform:scale(.5)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
.hud{position:absolute;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:4;background:rgba(0,0,0,.65);padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;pointer-events:none;white-space:nowrap}
#rflash{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;opacity:0;pointer-events:none;z-index:3}
#rflash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1;transform:scale(.8)}100%{opacity:0;transform:scale(1.15)}}
#dim{position:fixed;inset:0;z-index:56;background:#000;opacity:0;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sbox{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.sbox button{text-align:left;padding:15px 4px;font-size:16px;border-bottom:1px solid var(--line)}
.sbox button:last-child{border:0;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.mbox{width:100%;max-width:360px;background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.mbox h3{margin:0;font-size:17px}
.mbox input{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:inherit}
.mbtns{display:flex;gap:10px;justify-content:flex-end}
#now .pc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding-bottom:48px}
.nart{width:min(72vw,300px);aspect-ratio:1;border-radius:28px;display:grid;place-items:center;color:rgba(255,255,255,.92)}
.ntitle{font-size:19px;font-weight:800;text-align:center;overflow-wrap:anywhere;max-width:100%;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nseek{display:flex;align-items:center;gap:10px;width:100%;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;justify-content:center;gap:12px;max-width:100%}
.ctl .ib{width:52px;height:52px}
.ctl .ib svg{width:28px;height:28px}
.ctl .big{width:68px;height:68px;background:var(--accent);color:var(--ink)}
.ctl .big svg{width:34px;height:34px}
.mprog{height:2px;background:var(--surface-2)}
.mprog i{display:block;height:100%;width:0;background:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:28px;margin:0;flex:1;min-width:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--surface-2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);margin-top:-6px;border:0}
#fatal{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#2a0f14;color:#ffb3b3;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));font:13px/1.4 monospace;word-break:break-word;user-select:text;border-top:2px solid var(--danger)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="fatal" hidden></div>
<script>
(function(){
  function show(m){var f=document.getElementById('fatal');if(f){f.hidden=false;f.textContent='Error: '+m}}
  window.addEventListener('error',function(e){show((e.message||'unknown')+(e.lineno?' (line '+e.lineno+')':''))});
  window.addEventListener('unhandledrejection',function(e){var r=e.reason;show((r&&r.message)||String(r))});
})();
</script>
<div id="app">
  <header class="top g">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#ffb52e"/><path d="M7.5 9h17L16 24.5z" fill="#1a1204"/></svg>
      <span>V Player</span>
    </div>
    <div class="acts">
      <button class="ib" type="button" data-act="search" aria-label="Search" id="bSearch"></button>
      <button class="ib" type="button" data-act="recent" aria-label="Recent" id="bRecent"></button>
      <button class="ib" type="button" data-act="settings" aria-label="Settings" id="bSet"></button>
    </div>
  </header>
  <div class="srch g" id="srch" hidden><input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search"></div>

  <main id="view"><div class="center g"><div class="spin"></div><p>Starting…</p></div></main>

  <div id="mini" hidden>
    <div class="g mini">
      <div class="art" id="mArt" data-act="nowopen" style="width:40px;height:40px;border-radius:10px"></div>
      <div class="tx" data-act="nowopen"><div class="ttl" id="mTitle"></div></div>
      <button class="ib" type="button" data-act="mplay" aria-label="Play or pause" id="mPlay"></button>
      <button class="ib" type="button" data-act="mclose" aria-label="Close" id="mClose"></button>
    </div>
    <div class="mprog"><i id="mProg"></i></div>
  </div>

  <nav class="tabs" aria-label="Tabs">
    <div class="g tabin" role="tablist">
      <button class="tab" type="button" role="tab" data-tab="videos" aria-label="Videos" id="tVideos"></button>
      <button class="tab" type="button" role="tab" data-tab="shorts" aria-label="Shorts" id="tShorts"></button>
      <button class="tab" type="button" role="tab" data-tab="songs" aria-label="Songs" id="tSongs"></button>
    </div>
  </nav>
</div>

<section class="panel" id="recent" hidden>
  <header class="ph g"><button class="ib" type="button" data-act="back" aria-label="Back" id="rBack"></button><h2>Recent</h2></header>
  <div class="pc g" id="recentList"></div>
</section>

<section class="panel" id="settings" hidden>
  <header class="ph g"><button class="ib" type="button" data-act="back" aria-label="Back" id="sBack"></button><h2>Settings</h2></header>
  <div class="pc g">
    <div class="kv"><span>Access to videos and songs</span><span id="sAccess">-</span></div>
    <div class="kv"><span>Videos</span><span id="sV">0</span></div>
    <div class="kv"><span>Shorts</span><span id="sS">0</span></div>
    <div class="kv"><span>Songs</span><span id="sM">0</span></div>
    <div class="set" style="margin-top:18px">
      <button class="btn" type="button" data-act="rescan">Scan phone again</button>
      <button class="btn alt" type="button" data-act="unhide">Show hidden items again</button>
    </div>
  </div>
</section>

<section class="panel" id="now" hidden>
  <header class="ph g"><button class="ib" type="button" data-act="back" aria-label="Back" id="nBack"></button><h2>Now playing</h2></header>
  <div class="pc g">
    <div class="nart" id="nArt"></div>
    <div class="ntitle" id="nTitle"></div>
    <div class="nseek"><span id="nCur">0:00</span><input type="range" id="nSeek" min="0" max="1000" value="0" aria-label="Seek"><span id="nTot">0:00</span></div>
    <div class="ctl">
      <button class="ib" type="button" data-act="nprev" aria-label="Previous song" id="nPrev"></button>
      <button class="ib" type="button" data-act="nb10" aria-label="Back 10 seconds" id="nB10"></button>
      <button class="ib big" type="button" data-act="nplay" aria-label="Play or pause" id="nPlay"></button>
      <button class="ib" type="button" data-act="nf10" aria-label="Forward 10 seconds" id="nF10"></button>
      <button class="ib" type="button" data-act="nnext" aria-label="Next song" id="nNext"></button>
    </div>
  </div>
</section>

<section id="reels" hidden>
  <div class="rtrack" id="rtrack"></div>
  <button class="ib rback" type="button" data-act="back" aria-label="Back" id="rBackBtn"></button>
  <div class="rcap"><div class="g"><div class="t" id="rTitle"></div><button class="s rtime" type="button" data-act="rtime" id="rSub"></button></div></div>
  <div class="rside">
    <div class="sbw"><button class="sb" type="button" data-act="rlike" aria-label="Like" id="bLike"></button><span id="lCount">0</span></div>
    <button class="sb" type="button" data-act="rsound" aria-label="Sound" id="bSound"></button>
    <button class="sb" type="button" data-act="rhide" aria-label="Hide from app" id="bHide"></button>
    <button class="sb" type="button" data-act="rmore" aria-label="More" id="bMore"></button>
  </div>
  <div class="rprog" id="rprog"><div class="rbar"><i id="rprogi"></i></div></div>
  <div class="hud" id="hud" hidden></div>
  <div id="rflash"></div>
  <div id="rheart"></div>
</section>
<div id="dim"></div>
<div class="sheet" id="sheet" hidden data-act="sheetclose">
  <div class="sbox">
    <button type="button" data-act="srename">Rename</button>
    <button type="button" data-act="slikes">Edit likes</button>
    <button type="button" data-act="sframe">Use this frame as thumbnail</button>
    <button type="button" data-act="sgallery">Choose thumbnail from gallery</button>
    <button type="button" data-act="sheetclose">Cancel</button>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="mbox">
    <h3 id="mdTitle"></h3>
    <input id="mdInput" autocomplete="off">
    <div class="mbtns"><button type="button" class="btn alt" data-act="mdcancel">Cancel</button><button type="button" class="btn" data-act="mdsave">Save</button></div>
  </div>
</div>
<input type="file" id="imgIn" accept="image/*" hidden>

<div id="player" hidden>
  <video id="pv" controls playsinline></video>
  <button class="ib" type="button" data-act="back" aria-label="Back" id="pback"></button>
  <div id="ptitle"></div>
</div>
<audio id="aud" preload="auto"></audio>
<div id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const Cap=window.Capacitor;
const native=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
let Media=null,VEngine=null;
if(native){
  try{Media=Cap.registerPlugin('MediaScan')}catch(e){try{Media=Cap.Plugins&&Cap.Plugins.MediaScan}catch(x){}}
  /* Native thumbnail extraction is provided by the same VEngine plugin as ExoPlayer. */
  try{VEngine=Cap.registerPlugin('VEngine')}catch(e){try{VEngine=Cap.Plugins&&Cap.Plugins.VEngine}catch(x){}}
}
const fileSrc=p=>Cap.convertFileSrc(p);

const I={
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  recent:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>',
  pause:'<path d="M7 5h3.6v14H7zM13.4 5H17v14h-3.6z" fill="currentColor" stroke="none"/>',
  videos:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/>',
  shorts:'<rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/>',
  songs:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',

}

  const tm=setTimeout(()=>fin(''),7000);

/* Extract thumbnails on Android with MediaMetadataRetriever through VEngine.thumb.

let seekS=null;
function tapPause(){
  const v=rEls[ridx]&&rEls[ridx]._v;if(!v)return;
  const f=$('#rflash');
  if(v.paused){playV(v);f.innerHTML=ic('play',36)}else{v.pause();f.innerHTML=ic('pause',36)}
  f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
}
/* brightness and volume: the app asks the phone; if the phone part is missing, it falls back to a dark layer and the video volume */
async function getBV(){
  bright=.5;vol=.5;
  if(Media&&nativeBV){
    try{bright=(await Media.getBrightness()).value;vol=(await Media.getVolume()).value}catch(e){nativeBV=false}
  }
  if(!nativeBV){const v=rEls[ridx]&&rEls[ridx]._v;vol=v?v.volume:1;bright=1}
}
function setBright(b){
  if(Media&&nativeBV){Media.setBrightness({value:b}).catch(()=>{nativeBV=false;$('#dim').style.opacity=(1-b)*.85})}
  else $('#dim').style.opacity=(1-b)*.85;
}
function setVol(x){
  if(Media&&nativeBV){Media.setVolume({value:x}).catch(()=>{nativeBV=false;rEls.forEach(e=>{if(e._v)e._v.volume=x})})}
  else rEls.forEach(e=>{if(e._v)e._v.volume=x});
}
function showHud(t){const h=$('#hud');h.textContent=t;h.hidden=false;clearTimeout(rHudT)}
function hideHudSoon(){clearTimeout(rHudT);rHudT=setTimeout(()=>{$('#hud').hidden=true},700)}

reelsEl.addEventListener('pointerdown',e=>{
  if(e.target.closest('button,input,.rprog'))return;
  ps={id:e.pointerId,x:e.clientX,y:e.clientY,zone:e.clientY<reelsEl.clientHeight*.40?'bright':(e.clientY<reelsEl.clientHeight*.65?'vol':'seek'),mode:'',drag:0,lastY:e.clientY,lastT:performance.now(),v:0,base:0};
  try{reelsEl.setPointerCapture(e.pointerId)}catch(x){}
  const s=ps;
  s.hold=setTimeout(()=>{if(ps===s&&!s.mode){s.mode='hold';const v=rEls[ridx]&&rEls[ridx]._v;if(v)v.playbackRate=2;showHud('2x speed')}},450);
});
reelsEl.addEventListener('pointermove',e=>{
  const s=ps;if(!s||e.pointerId!==s.id)return;
  const dx=e.clientX-s.x,dy=e.clientY-s.y;
  if(!s.mode){
    if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
    clearTimeout(s.hold);
    s.mode=Math.abs(dx)>Math.abs(dy)?s.zone:'page';
    s.base=s.mode==='bright'?bright:vol;
    if(s.mode==='seek'){const sv=rEls[ridx]&&rEls[ridx]._v;if(!sv||!sv.duration){s.mode='none'}else{s.base=sv.currentTime;s.span=Math.min(sv.duration,30)}}
    if(s.mode==='page')track.style.transition='none';
  }
  if(s.mode==='page'){
    s.drag=dy;
    const now=performance.now(),dt=now-s.lastT;
    if(dt>0)s.v=0.7*s.v+0.3*((e.clientY-s.lastY)/dt);
    s.lastY=e.clientY;s.lastT=now;
    track.style.transform=`translate3d(0,${-ridx*rH+dy}px,0)`;
  }else if(s.mode==='seek'){
    const sv=rEls[ridx]._v,t=clamp(s.base+dx/reelsEl.clientWidth*s.span,0,sv.duration);
    s.t=t;seekS={t};const df=Math.round(t-s.base);
    showHud((df>=0?'+':'')+df+'s  ('+fmt(t)+')');paintTime();
  }else if(s.mode==='bright'||s.mode==='vol'){
    const val=clamp(s.base+dx/(reelsEl.clientWidth*0.75),0,1);
    if(s.mode==='bright'){bright=val;setBright(val);showHud('Brightness '+Math.round(val*100)+'%')}
    else{vol=val;setVol(val);showHud('Volume '+Math.round(val*100)+'%')}
  }
});
function endPtr(e,cancel){
  const s=ps;if(!s||e.pointerId!==s.id)return;
  ps=null;clearTimeout(s.hold);
  if(s.mode==='hold'){const v=rEls[ridx]&&rEls[ridx]._v;if(v)v.playbackRate=1;hideHudSoon();return}
  if(s.mode==='page'){
    if(!cancel&&(s.drag<-40||s.v<-0.4))go(ridx+1);
    else if(!cancel&&(s.drag>40||s.v>0.4))go(ridx-1);
    else go(ridx);
    return;
  }
  if(s.mode==='seek'){
    const sv=rEls[ridx]&&rEls[ridx]._v;
    if(!cancel&&sv&&s.t!=null)sv.currentTime=s.t;
    seekS=null;hideHudSoon();paintTime();return;
  }
  if(s.mode){hideHudSoon();return}
  if(cancel)return;
  const now=performance.now();
  if(now-lastTap<260){clearTimeout(tapT);lastTap=0;doubleTap()}
  else{lastTap=now;tapT=setTimeout(()=>{lastTap=0;tapPause()},230)}
}
reelsEl.addEventListener('pointerup',e=>endPtr(e,false));
reelsEl.addEventListener('pointercancel',e=>endPtr(e,true));
(function(){
  const bar=$('#rprog');let ptr=null;
  function at(e){const r=bar.getBoundingClientRect(),v=rEls[ridx]&&rEls[ridx]._v;if(!v||!v.duration)return;
    const f=clamp((e.clientX-r.left)/r.width,0,1);seekS={t:f*v.duration};$('#rprogi').style.width=(f*100)+'%';paintTime();return v}
  bar.addEventListener('pointerdown',e=>{ptr=e.pointerId;try{bar.setPointerCapture(e.pointerId)}catch(x){}bar.classList.add('on');at(e);e.stopPropagation()});
  bar.addEventListener('pointermove',e=>{if(e.pointerId===ptr)at(e)});
  const end=(e,c)=>{if(e.pointerId!==ptr)return;ptr=null;bar.classList.remove('on');const v=rEls[ridx]&&rEls[ridx]._v;if(!c&&v&&seekS)v.currentTime=seekS.t;seekS=null;paintTime()};
  bar.addEventListener('pointerup',e=>end(e,false));bar.addEventListener('pointercancel',e=>end(e,true));
})();
window.addEventListener('resize',()=>{if(!reelsEl.hidden){rH=reelsEl.clientHeight;go(ridx,true)}});
function closeReels(){
  clearTimeout(hideArm);
  rEls.forEach((e,j)=>freeVideo(j));rEls=[];rq=[];track.innerHTML='';
  $('#sheet').hidden=true;$('#modal').hidden=true;$('#hud').hidden=true;$('#dim').style.opacity=0;
  if(Media&&nativeBV)Media.setBrightness({value:-1}).catch(()=>{});
  render();
}

/* ---------- more menu: rename, likes, thumbnail ---------- */
function openModal(m){
  const it=rq[ridx];if(!it)return;
  mdMode=m;
  $('#mdTitle').textContent=m==='rename'?'Rename':'Edit likes';
  const inp=$('#mdInput');
  inp.type=m==='rename'?'text':'number';
  if(m==='likes'){inp.min='0';inp.inputMode='numeric'}
  inp.value=m==='rename'?title(it):likesOf(it.id);
  $('#modal').hidden=false;setTimeout(()=>inp.focus(),50);
}
function saveModal(){
  const it=rq[ridx];if(!it){$('#modal').hidden=true;return}
  const val=$('#mdInput').value;
  if(mdMode==='rename'){
    const t=val.trim();
    setM(it.id,{title:t||undefined});
    toast(t?'Renamed':'Original name restored');
  }else{
    const n=Math.max(0,Math.min(999999,parseInt(val,10)||0));
    setM(it.id,{likes:n});toast('Likes changed');
  }
  $('#modal').hidden=true;updateOverlay();
}
function setThumb(id,url){thumbs.set(id,url);setM(id,{thumb:url});toast('Thumbnail changed')}
function thumbFromFrame(){
  const v=rEls[ridx]&&rEls[ridx]._v;
  if(!v||!v.videoWidth){toast('Play the short first, then try again');return}
  const c=document.createElement('canvas'),s=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));
  c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
  try{c.getContext('2d').drawImage(v,0,0,c.width,c.height);setThumb(rq[ridx].id,c.toDataURL('image/jpeg',.82))}
  catch(e){toast('Could not take the frame')}
}
$('#imgIn').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';
  if(!f||!rq[ridx])return;
  const id=rq[ridx].id,url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    setThumb(id,c.toDataURL('image/jpeg',.82));
  };
  im.onerror=()=>{URL.revokeObjectURL(url);toast('Could not read that picture')};
  im.src=url;
});

/* ---------- reading the phone ---------- */
async function init(){
  if(!native){render();return}
  if(!Media){errMsg='The phone reader inside the app was not found (MediaScan missing).';render();return}
  try{const r=await Media.check();perm=!!r.granted}catch(e){perm=false}
  if(perm)await scan();else render();
}
async function ask(){
  try{const r=await Media.request();perm=!!r.granted}catch(e){perm=false}
  if(perm)await scan();else{render();toast('Access was not allowed')}
}
async function scan(){
  const quiet=all.length>0;
  loading=true;errMsg='';if(!quiet)render();
  try{
    const r=await Media.scan();
    all=(r.items||[]).filter(i=>i&&i.path&&!(meta[i.id]&&meta[i.id].hidden));
    byId=new Map(all.map(i=>[i.id,i]));
    lastScan=Date.now();
  }catch(e){errMsg=(e&&e.message)||'Unknown error'}
  loading=false;render();
  if($('#settings').hidden===false)fillSettings();
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&native&&perm&&!loading)scan();
});

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  switch(act){
    case 'play':playItem(byId.get(id));break;
    case 'playrecent':{const it=byId.get(id);if(it)playItem(it);else{let l=[];try{l=JSON.parse(localStorage.getItem('vp-recent')||'[]')}catch(x){}playItem(l.find(x=>x.id===id))}break}
    case 'search':{const s=$('#srch');s.hidden=!s.hidden;if(!s.hidden)$('#q').focus();else{q='';$('#q').value='';render()}break}
    case 'recent':fillRecent();openLayer('recent');break;
    case 'settings':openLayer('settings');break;
    case 'back':closeTop();break;
    case 'ask':ask();break;
    case 'rescan':scan();break;
    case 'mplay':if(aud.src){aud.paused?aud.play():aud.pause()}break;
    case 'nowopen':if(aud.src&&$('#now').hidden)openLayer('now');break;
    case 'nplay':if(aud.src){aud.paused?aud.play():aud.pause()}break;
    case 'nprev':if(aud.currentTime>3)aud.currentTime=0;else stepSong(-1);break;
    case 'nnext':stepSong(1);break;
    case 'nb10':aud.currentTime=Math.max(0,aud.currentTime-10);break;
    case 'nf10':aud.currentTime=Math.min(aud.duration||1e9,aud.currentTime+10);break;
    case 'rlike':likeNow();break;
    case 'rtime':toggleTime();break;
    case 'rsound':muted=!muted;syncSound();break;
    case 'rhide':hideNow();break;
    case 'rmore':$('#sheet').hidden=false;break;
    case 'sheetclose':$('#sheet').hidden=true;break;
    case 'srename':$('#sheet').hidden=true;openModal('rename');break;
    case 'slikes':$('#sheet').hidden=true;openModal('likes');break;
    case 'sframe':$('#sheet').hidden=true;thumbFromFrame();break;
    case 'sgallery':$('#sheet').hidden=true;$('#imgIn').click();break;
    case 'mdcancel':$('#modal').hidden=true;break;
    case 'mdsave':saveModal();break;
    case 'unhide':Object.keys(meta).forEach(k=>{if(meta[k]&&meta[k].hidden){delete meta[k].hidden}});saveMetaStore();toast('Hidden items are back');scan();break;
    case 'mclose':aud.pause();aud.removeAttribute('src');aud.load();$('#mini').hidden=true;break;
  }
});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  tab=b.dataset.tab;try{localStorage.setItem('vp-tab',tab)}catch(e){}render();
}));
$('#q').addEventListener('input',e=>{q=e.target.value;render()});
init();
})();
</script>
</body>
